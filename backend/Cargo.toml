[package]
name = "comtrak-backend"
version = "0.1.0"
edition = "2021"
authors = ["ComTrak Team"]
description = "ComTrak Rust backend: Offline-first Commission Tracker with SQLite and Garage S3"

[dependencies]
# Web framework & async runtime
axum = { version = "0.8.1", features = ["multipart"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5.2" }
tower-http = { version = "0.6.2", features = ["cors", "trace", "compression-full"] }

# Database (SQLite with SQLx)
sqlx = { version = "0.8.3", features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "chrono",
    "migrate"
] }

# S3 Client for Garage
aws-config = { version = "1.5.18", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1.74.0", default-features = false, features = ["rustls", "rt-tokio"] }
aws-credential-types = "1.2.1"

# Serialization & Data types
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
uuid = { version = "1.15.1", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }

# Authentication & Security
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }

# Configuration & Logging
dotenvy = "0.15.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.11"
anyhow = "1.0.96"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

