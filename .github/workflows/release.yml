name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.COMTRAK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "No custom release keystore secret found; build will use fallback signing."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        env:
          STORE_PASS: ${{ secrets.COMTRAK_RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.COMTRAK_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COMTRAK_RELEASE_KEY_ALIAS }}
        run: |
          cd android
          ARGS=()
          if [ -n "$STORE_PASS" ]; then
            ARGS+=("-PCOMTRAK_RELEASE_STORE_PASSWORD=$STORE_PASS")
          fi
          if [ -n "$KEY_PASS" ]; then
            ARGS+=("-PCOMTRAK_RELEASE_KEY_PASSWORD=$KEY_PASS")
          fi
          if [ -n "$KEY_ALIAS" ]; then
            ARGS+=("-PCOMTRAK_RELEASE_KEY_ALIAS=$KEY_ALIAS")
          fi
          ./gradlew assembleRelease "${ARGS[@]}"

      - name: Prepare APK Asset
        id: prepare_asset
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="manual-${{ github.sha }}"
          fi
          APK_NAME="ComTrak-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_asset.outputs.apk_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
